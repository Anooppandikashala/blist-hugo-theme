{{ define "main" }}
<div class="container px-6 pt-8 pb-16 mx-auto max-w-4xl">

  <!-- Page header -->
  <div class="section-header mb-3">
    <h1 class="text-xs font-bold uppercase tracking-widest text-gray-400 dark:text-gray-500 anooptube-blogtitle-fontFamily-Michroma anooptube-letter-spacing-for-michroma whitespace-nowrap">All Playlists</h1>
    <div class="section-header-line"></div>
  </div>

  <p class="text-sm text-gray-400 dark:text-gray-600 mb-8">
    {{ len .Pages }} playlists &nbsp;·&nbsp; {{ len .Site.RegularPages }} posts total
  </p>

  <!-- Collapsible directory tree -->
  <div class="playlist-tree">
    {{ range .Pages.ByTitle }}
    <details class="playlist-folder">

      <summary class="playlist-folder-summary">
        <div class="folder-left">
          <!-- Chevron (rotates when open) -->
          <svg class="folder-chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
          <!-- Folder icon -->
          <svg class="folder-icon" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/>
          </svg>
          <span class="folder-name">{{ .Title }}</span>
        </div>
        <span class="folder-badge">{{ len .Pages }}</span>
      </summary>

      <ul class="playlist-posts">
        {{ range .Pages.ByDate.Reverse }}
        <li>
          <a href="{{ .RelPermalink }}" class="playlist-post-link">
            <!-- File icon -->
            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
              <path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/>
            </svg>
            <span>{{ .Title }}</span>
          </a>
        </li>
        {{ end }}
      </ul>

    </details>
    {{ end }}
  </div>

</div>
{{ end }}
