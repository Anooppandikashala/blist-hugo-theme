{{- /* The series overview now lives on the blog page; send visitors and crawlers there */ -}}
{{- $to := "/blog/" | absLangURL -}}
<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
  <title>{{ $to }}</title>
  <link rel="canonical" href="{{ $to }}" />
  <meta name="robots" content="noindex" />
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url={{ $to }}#series" />
</head>
</html>
