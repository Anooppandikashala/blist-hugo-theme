<nav class="post-breadcrumbs" aria-label="Breadcrumb">
    <a href="{{ "/" | relLangURL }}">Home</a>
    <span class="post-breadcrumbs-sep" aria-hidden="true">›</span>
    <a href="{{ "/blog" | relLangURL }}">Blog</a>
    {{ $playlist := "" }}
    {{ if .Params.playlists }}{{ $playlist = index .Params.playlists 0 }}{{ end }}
    {{ if $playlist }}
    <span class="post-breadcrumbs-sep" aria-hidden="true">›</span>
    <a href="{{ printf "/playlists/%s" ($playlist | urlize) | relLangURL }}">{{ $playlist }}</a>
    {{ end }}
    <span class="post-breadcrumbs-sep" aria-hidden="true">›</span>
    <span class="post-breadcrumbs-current" title="{{ .Title }}">{{ .Title }}</span>
</nav>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ .Site.BaseURL }}
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": {{ (print .Site.BaseURL "blog/") }}
    }{{ if $playlist }},
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ $playlist }},
      "item": {{ (printf "%splaylists/%s/" .Site.BaseURL ($playlist | urlize)) }}
    },
    {
      "@type": "ListItem",
      "position": 4,
      "name": {{ .Title }},
      "item": {{ .Permalink }}
    }
    {{ else }},
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ .Title }},
      "item": {{ .Permalink }}
    }
    {{ end }}
  ]
}
</script>
