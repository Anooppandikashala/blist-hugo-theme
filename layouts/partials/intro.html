            <p class="text-xs font-medium tracking-widest uppercase text-gray-400 dark:text-gray-500 mb-5 anooptube-blogtitle-fontFamily-Michroma anooptube-letter-spacing-for-michroma">{{ .Site.Params.introTitle | safeHTML }}</p>

            <div class="flex items-center gap-3 flex-wrap">
                <a href="https://www.youtube.com/anooptube" target="_blank" rel="noopener"
                   class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-red-500 hover:bg-red-600 text-white text-sm font-medium transition-colors shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="18" height="18" viewBox="0 0 48 48">
                        <path fill="#fff" d="M43.2,33.9c-0.4,2.1-2.1,3.7-4.2,4c-3.3,0.5-8.8,1.1-15,1.1c-6.1,0-11.6-0.6-15-1.1c-2.1-0.3-3.8-1.9-4.2-4C4.4,31.6,4,28.2,4,24c0-4.2,0.4-7.6,0.8-9.9c0.4-2.1,2.1-3.7,4.2-4C12.3,9.6,17.8,9,24,9c6.2,0,11.6,0.6,15,1.1c2.1,0.3,3.8,1.9,4.2,4c0.4,2.3,0.9,5.7,0.9,9.9C44,28.2,43.6,31.6,43.2,33.9z"></path>
                        <path fill="#c4302b" d="M20 31L20 17 32 24z"></path>

                    YouTube
                </a>
                <a href="https://www.buymeacoffee.com/anoopp" target="_blank" rel="noopener"
                   class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 text-sm font-medium hover:border-gray-400 dark:hover:border-gray-500 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
                    ☕ Buy me a coffee
                </a>
            </div>
        </div>
        <div class="order-first md:order-last">
            {{- partial "hero-svg.html" . -}}
        </div>

</section>
