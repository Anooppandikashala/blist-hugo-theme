{{ define "main" }}

<section class="container max-w-lg mx-auto px-6 py-16 md:py-24 text-center">

  <!-- Terminal SVG illustration -->
  <div class="flex justify-center mb-8">
    <svg viewBox="0 0 360 180" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:360px;max-width:100%;">
      <defs>
        <radialGradient id="err-glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ef4444" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <!-- Background glow -->
      <ellipse cx="180" cy="90" rx="170" ry="85" fill="url(#err-glow)"/>

      <!-- Floating badge: 404 -->
      <rect x="268" y="4" width="84" height="28" rx="8" fill="#1e1b4b"/>
      <text x="310" y="22" font-family="Courier New,monospace" font-size="13" fill="#818cf8" text-anchor="middle" font-weight="700">404</text>

      <!-- Floating badge: ERR -->
      <rect x="8" y="148" width="64" height="26" rx="7" fill="#2d0a0a"/>
      <text x="40" y="165" font-family="Courier New,monospace" font-size="11" fill="#f87171" text-anchor="middle">ERR</text>

      <!-- Card shadow -->
      <rect x="14" y="20" width="324" height="152" rx="12" fill="black" opacity="0.22"/>
      <!-- Card body -->
      <rect x="8" y="14" width="324" height="152" rx="12" fill="#0d1117"/>

      <!-- Title bar -->
      <rect x="8" y="14" width="324" height="36" rx="12" fill="#161b22"/>
      <rect x="8" y="32" width="324" height="18" fill="#161b22"/>

      <!-- Traffic lights -->
      <circle cx="30" cy="32" r="5" fill="#ff5f56"/>
      <circle cx="48" cy="32" r="5" fill="#ffbd2e"/>
      <circle cx="66" cy="32" r="5" fill="#27c93f"/>

      <!-- File tab -->
      <rect x="84" y="18" width="88" height="22" rx="5" fill="#0d1117"/>
      <circle cx="96" cy="29" r="3" fill="#f87171" opacity="0.7"/>
      <text x="134" y="33" font-family="Courier New,monospace" font-size="10" fill="#8b949e" text-anchor="middle">404.sh</text>

      <!-- Gutter line -->
      <line x1="8" y1="50" x2="332" y2="50" stroke="#21262d" stroke-width="1"/>

      <!-- Line numbers -->
      <text font-family="Courier New,monospace" font-size="10" fill="#3d4450" text-anchor="end">
        <tspan x="26" y="74">1</tspan>
        <tspan x="26" dy="22">2</tspan>
        <tspan x="26" dy="22">3</tspan>
        <tspan x="26" dy="22">4</tspan>
      </text>

      <!-- Gutter -->
      <line x1="34" y1="50" x2="34" y2="166" stroke="#21262d" stroke-width="1"/>

      <!-- Line 1: $ fetch /this-page -->
      <text font-family="Courier New,monospace" font-size="12">
        <tspan x="44" y="74" fill="#3fb950">$</tspan>
        <tspan x="56" y="74" fill="#8b949e"> fetch /this-page</tspan>
      </text>

      <!-- Line 2: GET 404 — Not Found (highlighted) -->
      <rect x="34" y="80" width="298" height="20" fill="#2d1215"/>
      <text font-family="Courier New,monospace" font-size="12">
        <tspan x="44" y="95" fill="#f85149">GET</tspan>
        <tspan x="72" y="95" fill="#8b949e"> 404</tspan>
        <tspan x="106" y="95" fill="#6e7681"> —</tspan>
        <tspan x="122" y="95" fill="#ff7b72"> Not Found</tspan>
      </text>

      <!-- Line 3: comment -->
      <text font-family="Courier New,monospace" font-size="12">
        <tspan x="44" y="117" fill="#6e7681">// page was moved or never existed</tspan>
      </text>

      <!-- Line 4: suggestion prompt -->
      <text font-family="Courier New,monospace" font-size="12">
        <tspan x="44" y="139" fill="#3fb950">$</tspan>
        <tspan x="56" y="139" fill="#8b949e"> search </tspan>
        <tspan x="112" y="139" fill="#a5d6ff">"try a keyword"</tspan>
      </text>

      <!-- Blinking cursor -->
      <rect x="44" y="149" width="7" height="12" fill="#56d364">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>

    </svg>
  </div>

  <!-- Error badge -->
  <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold mb-4" style="background:rgba(239,68,68,0.08);color:#ef4444;">
    <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" fill="none">
      <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
      <circle cx="12" cy="12" r="9"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    Error 404
  </div>

  <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Page not found</h1>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-8 max-w-sm mx-auto leading-relaxed">
    This page has been moved, deleted, or never existed. Search below or head back home.
  </p>

  <!-- Inline search -->
  <div class="relative mb-2 text-left">
    <svg class="absolute left-3.5 pointer-events-none text-gray-400" style="top:50%;transform:translateY(-50%);" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
      <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
      <circle cx="10" cy="10" r="7"/>
      <line x1="21" y1="21" x2="15" y2="15"/>
    </svg>
    <input id="err-search" type="search" class="err-search-input" placeholder="Search posts…" autocomplete="off" spellcheck="false" />
  </div>

  <div id="err-results" class="err-results-box hidden text-left mb-6"></div>
  <p id="err-no-results" class="hidden text-sm text-gray-400 dark:text-gray-600 mb-6">No posts found for that query.</p>

  <!-- Action buttons -->
  <div class="flex items-center justify-center gap-3 flex-wrap">
    <a href="{{ .Site.BaseURL }}"
       class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-medium text-white transition-colors"
       style="background:#4f46e5;">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
        <polyline points="5 12 3 12 12 3 21 12 19 12"/>
        <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/>
        <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/>
      </svg>
      Go home
    </a>
    <a href="/blog"
       class="inline-flex items-center gap-2 px-5 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 text-sm font-medium hover:border-gray-400 dark:hover:border-gray-500 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all">
      Browse posts
    </a>
  </div>

</section>

<script>
(function () {
  var input = document.getElementById('err-search');
  var resultsEl = document.getElementById('err-results');
  var noResultsEl = document.getElementById('err-no-results');
  if (!input) return;

  var errFuse = null, loading = false;

  function loadIndex(cb) {
    if (errFuse) { cb(); return; }
    if (loading) return;
    loading = true;
    fetch('/index.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        errFuse = new Fuse(data, {
          shouldSort: true, threshold: 0.4, minMatchCharLength: 2,
          keys: ['title', 'contents', 'tags']
        });
        cb();
      })
      .catch(function () { loading = false; });
  }

  function fmtDate(d) {
    if (!d) return '';
    return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function render(results) {
    if (!results.length) {
      resultsEl.classList.add('hidden');
      noResultsEl.classList.remove('hidden');
      return;
    }
    noResultsEl.classList.add('hidden');
    resultsEl.classList.remove('hidden');
    resultsEl.innerHTML = results.slice(0, 8).map(function (r) {
      var item = r.item;
      return '<a href="' + item.permalink + '" class="err-result-item">' +
        '<span class="err-result-title">' + item.title + '</span>' +
        (item.date ? '<span class="err-result-date">' + fmtDate(item.date) + '</span>' : '') +
        '<svg style="flex-shrink:0;color:#d1d5db;" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>' +
        '</a>';
    }).join('');
  }

  function doSearch(q) {
    if (!q.trim()) {
      resultsEl.classList.add('hidden');
      noResultsEl.classList.add('hidden');
      return;
    }
    if (!errFuse) { loadIndex(function () { doSearch(q); }); return; }
    render(errFuse.search(q));
  }

  input.addEventListener('input', function () { doSearch(this.value); });
  input.addEventListener('focus', function () { loadIndex(function () {}); }, { once: true });
})();
</script>

{{ end }}
